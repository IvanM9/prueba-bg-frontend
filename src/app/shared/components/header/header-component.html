<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-x-6 gap-y-3 px-4 py-3">
    <a routerLink="/products" class="text-lg font-bold tracking-tight text-slate-900">
      BG Carrito de compra
    </a>

    @if (currentUser(); as user) {
      <nav class="flex flex-wrap items-center gap-1 text-sm font-medium" aria-label="Navegación principal">
        <a
          routerLink="/products"
          routerLinkActive="bg-slate-100 text-slate-900"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-3 py-2 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Productos
        </a>
        <a
          routerLink="/cart"
          routerLinkActive="bg-slate-100 text-slate-900"
          class="rounded-lg px-3 py-2 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Carrito
        </a>
        <a
          routerLink="/orders"
          routerLinkActive="bg-slate-100 text-slate-900"
          class="rounded-lg px-3 py-2 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          Mis compras
        </a>
      </nav>

      <div class="ml-auto flex flex-wrap items-center gap-3">
        <span class="max-w-55 truncate text-sm text-slate-500" title="{{ user.email }}">
          {{ user.email }}
        </span>
        <button
          type="button"
          (click)="logout()"
          class="rounded-lg border border-slate-300 px-3.5 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
        >
          Salir
        </button>
      </div>
    }
  </div>
</header>
